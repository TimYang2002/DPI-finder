<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPS 遊戲 - 30秒倒數</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #scoreLabel, #timer { font-weight: bold; font-size: 18px; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
    #leaderboard p { margin: 0; }
    #endBtn { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>FPS 遊戲</h1>
  <p>分數: <span id="scoreLabel">0</span></p>
  <p>剩餘時間: <span id="timer">30</span> 秒</p>

  <div id="leaderboard">
    <h2>排行榜</h2>
  </div>

  <button id="endBtn">結束</button>

  <script>
    // ----------------------------
    // Supabase 初始化
    // ----------------------------
    const supabaseUrl = 'https://owjmyizqlnfnjgbowqma.supabase.co';
    const supabaseAnonKey = 'sb_publishable_9hC0ccCj3t9gk6O6T3LKhw_FLvAn7Tu';
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    let playerScore = 0;
    let timeLeft = 30;
    let gameOver = false;
    const scoreEl = document.getElementById('scoreLabel');
    const timerEl = document.getElementById('timer');
    const endBtn = document.getElementById('endBtn');

    // ----------------------------
    // 更新 HUD 分數
    // ----------------------------
    function updateScore(newScore) {
      playerScore = newScore;
      scoreEl.innerText = playerScore;
    }

    // ----------------------------
    // 存分數到 Supabase
    // ----------------------------
    async function saveScore(score) {
      const { data, error } = await supabase
        .from('scores')
        .insert([{ score }]);
      if(error) {
        console.error("存分數失敗", error);
      } else {
        console.log("分數已存入資料庫", data);
      }
    }

    // ----------------------------
    // 顯示排行榜
    // ----------------------------
    async function loadLeaderboard() {
      const { data, error } = await supabase
        .from('scores')
        .select('*')
        .order('score', { ascending: false })
        .limit(10);

      if(error) {
        console.error("讀排行榜失敗", error);
        return;
      }

      const board = document.getElementById('leaderboard');
      board.innerHTML = '<h2>排行榜</h2>' + data.map((item, i) => `<p>#${i+1}: ${item.score}</p>`).join('');
    }

    // ----------------------------
    // 30 秒倒數
    // ----------------------------
    const countdown = setInterval(() => {
      if(timeLeft <= 0) {
        clearInterval(countdown);
        gameOver = true;
        // 顯示結束按鈕
        endBtn.style.display = 'inline-block';
        // 畫面停止，分數不再增加
        alert("時間到！請按「結束」返回主選單");
        loadLeaderboard(); // 更新排行榜
      } else {
        timeLeft--;
        timerEl.innerText = timeLeft;
      }
    }, 1000);

    // ----------------------------
    // 模擬分數增加（可改成遊戲邏輯）
    // ----------------------------
    const scoreInterval = setInterval(() => {
      if(!gameOver) {
        updateScore(playerScore + Math.floor(Math.random()*10 + 1));
      }
    }, 1000);

    // ----------------------------
    // 結束按鈕事件
    // ----------------------------
    endBtn.onclick = async () => {
      if(!gameOver) return;
      // 存分數
      await saveScore(playerScore);
      alert(`分數 ${playerScore} 已存入資料庫！`);
      // 重置或回主選單
      location.reload(); // 簡單回主選單
    }

    // 初始化排行榜
    loadLeaderboard();
  </script>
</body>
</html>
