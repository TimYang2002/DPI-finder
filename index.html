<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPS 遊戲 - 倒數 30 秒</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #scoreLabel, #timer { font-weight: bold; font-size: 18px; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
    #leaderboard p { margin: 0; }
    #endBtn { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div id="hud">
      <div id="hud-left">
        <div class="hud-row">模式: <span id="modeLabel">自由練習</span></div>
        <div class="hud-row">分數: <span id="scoreLabel">0</span></div>
        <div class="hud-row">剩餘時間: <span id="timer">30</span> 秒</div>
      </div>
    </div>

    <div id="leaderboard">
      <h2>排行榜</h2>
    </div>

    <button id="endBtn">結束</button>
  </div>

  <!-- 你的遊戲程式 -->
  <script type="module" src="/src/main.js"></script>

  <script>
    // ----------------------------
    // Supabase 初始化
    // ----------------------------
    const supabaseUrl = 'https://owjmyizqlnfnjgbowqma.supabase.co';
    const supabaseAnonKey = 'sb_publishable_9hC0ccCj3t9gk6O6T3LKhw_FLvAn7Tu';
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    let timeLeft = 30;
    let gameOver = false;
    const timerEl = document.getElementById('timer');
    const scoreEl = document.getElementById('scoreLabel');
    const endBtn = document.getElementById('endBtn');

    // ----------------------------
    // 假設 main.js 有一個全域變數 gameScore
    // ----------------------------
    function getCurrentScore() {
      // 這裡抓 main.js 實際分數
      return window.gameScore || 0;
    }

    // ----------------------------
    // 存分數到 Supabase
    // ----------------------------
    async function saveScore(score) {
      const { data, error } = await supabase
        .from('scores')
        .insert([{ score }]);
      if(error) console.error("存分數失敗", error);
    }

    // ----------------------------
    // 排行榜
    // ----------------------------
    async function loadLeaderboard() {
      const { data, error } = await supabase
        .from('scores')
        .select('*')
        .order('score', { ascending: false })
        .limit(10);
      if(error) return;
      const board = document.getElementById('leaderboard');
      board.innerHTML = '<h2>排行榜</h2>' + data.map((item, i) => `<p>#${i+1}: ${item.score}</p>`).join('');
    }

    // ----------------------------
    // 30 秒倒數
    // ----------------------------
    const countdown = setInterval(() => {
      if(timeLeft <= 0) {
        clearInterval(countdown);
        gameOver = true;
        endBtn.style.display = 'inline-block';
        // 停止遊戲邏輯
        if(window.pauseGame) window.pauseGame(); // main.js 可提供 pauseGame() 停止動畫
        alert("時間到！請按「結束」返回主選單");
        loadLeaderboard();
      } else {
        timeLeft--;
        timerEl.innerText = timeLeft;
      }
    }, 1000);

    // ----------------------------
    // 結束按鈕
    // ----------------------------
    endBtn.onclick = async () => {
      if(!gameOver) return;
      const score = getCurrentScore();
      await saveScore(score);
      alert(`分數 ${score} 已存入資料庫！`);
      location.reload();
    }

    // 初始化排行榜
    loadLeaderboard();
  </script>
</body>
</html>
