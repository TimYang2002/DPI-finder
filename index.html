<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPS 遊戲 - 30秒倒數</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #scoreLabel, #timer { font-weight: bold; font-size: 18px; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
    #leaderboard p { margin: 0; }
    #endBtn { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div id="hud">
      <div id="hud-left">
        <div class="hud-row">模式: <span id="modeLabel">自由練習</span></div>
        <div class="hud-row">分數: <span id="scoreLabel">0</span></div>
        <div class="hud-row">剩餘時間: <span id="timer">30</span> 秒</div>
      </div>
      <div id="hud-right">
        <div class="hud-row">射擊: <span id="shotsLabel">0</span></div>
        <div class="hud-row">命中: <span id="hitsLabel">0</span></div>
        <div class="hud-row">命中率: <span id="accLabel">0%</span></div>
        <div class="hud-row">靈敏度: <span id="sensLabel">0.35</span></div>
      </div>
    </div>

    <div id="menu">
      <div class="panel">
        <h1>FPS 靈敏度練習</h1>
        <p class="sub">1600 DPI / VALORANT Sens</p>

        <div class="section">
          <label for="sensRange">靈敏度</label>
          <input id="sensRange" type="range" min="0.05" max="1.00" step="0.01" value="0.35" />
          <div class="small">當前: <span id="sensValue">0.35</span></div>
        </div>

        <div class="section">
          <label for="dpiInput">DPI</label>
          <input id="dpiInput" type="number" min="100" max="32000" step="50" value="1600" />
          <div class="small">eDPI: <span id="edpiValue">560</span></div>
        </div>

        <div class="section">
          <button id="playBtn">開始自由練習</button>
        </div>

        <div class="section small">點擊畫面進入滑鼠鎖定，Esc 退出。</div>
      </div>
    </div>

    <div id="leaderboard">
      <h2>排行榜</h2>
    </div>

    <button id="endBtn">結束</button>
  </div>

  <!-- 保留你原本遊戲 JS -->
  <script type="module" src="/src/main.js"></script>

  <!-- 倒數、存分數、排行榜功能 -->
  <script>
    const supabaseUrl = 'https://owjmyizqlnfnjgbowqma.supabase.co';
    const supabaseAnonKey = 'sb_publishable_9hC0ccCj3t9gk6O6T3LKhw_FLvAn7Tu';
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    let playerScore = 0;
    let timeLeft = 30;
    let gameOver = false;
    const scoreEl = document.getElementById('scoreLabel');
    const timerEl = document.getElementById('timer');
    const endBtn = document.getElementById('endBtn');

    // 更新分數
    function updateScore(newScore) {
      playerScore = newScore;
      scoreEl.innerText = playerScore;
    }

    // 存分數
    async function saveScore(score) {
      const { data, error } = await supabase
        .from('scores')
        .insert([{ score }]);
      if(error) console.error("存分數失敗", error);
    }

    // 排行榜
    async function loadLeaderboard() {
      const { data, error } = await supabase
        .from('scores')
        .select('*')
        .order('score', { ascending: false })
        .limit(10);
      if(error) return;
      const board = document.getElementById('leaderboard');
      board.innerHTML = '<h2>排行榜</h2>' + data.map((item, i) => `<p>#${i+1}: ${item.score}</p>`).join('');
    }

    // 倒數 30 秒
    const countdown = setInterval(() => {
      if(timeLeft <= 0) {
        clearInterval(countdown);
        gameOver = true;
        endBtn.style.display = 'inline-block';
        alert("時間到！請按「結束」返回主選單");
        loadLeaderboard();
      } else {
        timeLeft--;
        timerEl.innerText = timeLeft;
      }
    }, 1000);

    // 偵測遊戲分數更新（可替換成你 main.js 的遊戲分數）
    const scoreInterval = setInterval(() => {
      if(!gameOver) {
        // 這裡暫時模擬增加，可改成 main.js 的實際分數
        updateScore(playerScore + Math.floor(Math.random()*5 + 1));
      }
    }, 1000);

    // 結束按鈕
    endBtn.onclick = async () => {
      if(!gameOver) return;
      await saveScore(playerScore);
      alert(`分數 ${playerScore} 已存入資料庫！`);
      location.reload(); // 回主選單
    }

    loadLeaderboard();
  </script>
</body>
</html>
