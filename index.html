<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS 靈敏度校準 - Web 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
    <style>
      body { font-family: Arial; padding: 20px; }
      #score, #timer { font-weight: bold; }
      button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
      #leaderboard p { margin: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div id="hud-left">
          <div class="hud-row">模式: <span id="modeLabel">自由練習</span></div>
          <div class="hud-row">時間: <span id="timeLabel">00:00</span></div>
          <div class="hud-row">分數: <span id="scoreLabel">0</span></div>
          <div class="hud-row">剩餘時間: <span id="timer">30</span> 秒</div>
        </div>
        <div id="hud-right">
          <div class="hud-row">射擊: <span id="shotsLabel">0</span></div>
          <div class="hud-row">命中: <span id="hitsLabel">0</span></div>
          <div class="hud-row">命中率: <span id="accLabel">0%</span></div>
          <div class="hud-row">靈敏度: <span id="sensLabel">0.35</span></div>
        </div>
      </div>

      <div id="crosshair"></div>

      <div id="menu">
        <div class="panel">
          <h1>FPS 靈敏度練習</h1>
          <p class="sub">1600 DPI / VALORANT Sens</p>

          <div class="section">
            <label for="sensRange">靈敏度</label>
            <input id="sensRange" type="range" min="0.05" max="1.00" step="0.01" value="0.35" />
            <div class="small">當前: <span id="sensValue">0.35</span></div>
          </div>

          <div class="section">
            <label for="dpiInput">DPI</label>
            <input id="dpiInput" type="number" min="100" max="32000" step="50" value="1600" />
            <div class="small">eDPI: <span id="edpiValue">560</span></div>
          </div>

          <div class="section">
            <button id="playBtn">開始自由練習</button>
          </div>

          <div class="section small">點擊畫面進入滑鼠鎖定，Esc 退出。</div>
        </div>
      </div>

      <div id="leaderboard">
        <h2>排行榜</h2>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>

    <script>
      // =============================
      // Supabase 初始化
      // =============================
      const supabaseUrl = 'https://owjmyizqlnfnjgbowqma.supabase.co';
      const supabaseAnonKey = 'sb_publishable_9hC0ccCj3t9gk6O6T3LKhw_FLvAn7Tu';
      const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

      let playerScore = 0;
      let timeLeft = 30;
      let gameOver = false;

      // 更新 HUD 分數
      function updateHUDScore(score) {
        playerScore = score;
        document.getElementById('scoreLabel').innerText = playerScore;
      }

      // 存分數
      async function saveScore(score) {
        if(gameOver) return alert("遊戲已結束，不能再存分數");
        const { data, error } = await supabase
          .from('scores')
          .insert([{ score }]);
        if(error) {
          console.error("存分數失敗", error);
        } else {
          console.log("分數已存入資料庫", data);
          alert(`分數 ${score} 已存入！`);
          loadLeaderboard();
        }
      }

      // 讀排行榜
      async function loadLeaderboard() {
        const { data, error } = await supabase
          .from('scores')
          .select('*')
          .order('score', { ascending: false })
          .limit(10);

        if(error) {
          console.error("讀排行榜失敗", error);
          return;
        }

        const board = document.getElementById('leaderboard');
        board.innerHTML = '<h2>排行榜</h2>' + data.map((item, i) => `<p>#${i+1}: ${item.score}</p>`).join('');
      }

      // 生成存分數按鈕
      const saveBtn = document.createElement('button');
      saveBtn.innerText = '存分數';
      saveBtn.onclick = () => saveScore(playerScore);
      document.body.appendChild(saveBtn);

      // =============================
      // 30 秒倒數計時
      // =============================
      const timerEl = document.getElementById('timer');
      const countdown = setInterval(() => {
        if(timeLeft <= 0) {
          clearInterval(countdown);
          gameOver = true;
          saveBtn.disabled = true;
          alert(`時間到！你的分數: ${playerScore}`);
          loadLeaderboard();
        } else {
          timeLeft--;
          timerEl.innerText = timeLeft;
        }
      }, 1000);

      // =============================
      // 模擬遊戲增加分數（你可以替換成你的遊戲邏輯）
      // =============================
      setInterval(() => {
        if(!gameOver) {
          updateHUDScore(playerScore + Math.floor(Math.random() * 10 + 1));
        }
      }, 1000);

      // 初始化排行榜
      loadLeaderboard();
    </script>
  </body>
</html>
