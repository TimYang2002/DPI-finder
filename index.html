<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPS 靈敏度校準 - Web 3D</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="hud">
      <div id="hud-left">
        <div class="hud-row">模式: <span id="modeLabel">自由練習</span></div>
        <div class="hud-row">時間: <span id="timeLabel">00:00</span></div>
        <div class="hud-row">分數: <span id="scoreLabel">0</span></div>
      </div>
      <div id="hud-right">
        <div class="hud-row">射擊: <span id="shotsLabel">0</span></div>
        <div class="hud-row">命中: <span id="hitsLabel">0</span></div>
        <div class="hud-row">命中率: <span id="accLabel">0%</span></div>
        <div class="hud-row">靈敏度: <span id="sensLabel">0.35</span></div>
      </div>
    </div>
    <div id="crosshair"></div>
    <div id="menu">
      <div class="panel">
        <h1>FPS 靈敏度練習</h1>
        <p class="sub">1600 DPI / VALORANT Sens</p>
        <div class="section">
          <label for="sensRange">靈敏度</label>
          <input id="sensRange" type="range" min="0.05" max="1.00" step="0.01" value="0.35" />
          <div class="small">當前: <span id="sensValue">0.35</span></div>
        </div>
        <div class="section">
          <label for="dpiInput">DPI</label>
          <input id="dpiInput" type="number" min="100" max="32000" step="50" value="1600" />
          <div class="small">eDPI: <span id="edpiValue">560</span></div>
        </div>
        <div class="section">
          <button id="playBtn">開始自由練習</button>
        </div>
        <div class="section small">點擊畫面進入滑鼠鎖定，Esc 退出。</div>
      </div>
    </div>
  </div>

  <div id="leaderboard"></div>

  <h1>遊戲畫面</h1>
  <p>你的分數: <span id="score">0</span></p>

  <script>
    // 初始化 Supabase
    const supabaseUrl = 'https://owjmyizqlnfnjgbowqma.supabase.co';
    const supabaseAnonKey = 'sb_publishable_9hC0ccCj3t9gk6O6T3LKhw_FLvAn7Tu';
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    let playerScore = 0;

    // 存分數函式
    async function saveScore(score) {
      const { data, error } = await supabase
        .from('scores')
        .insert([{ score }]);
      if (error) {
        console.error('存分數失敗', error);
      } else {
        console.log('分數已存入資料庫', data);
        alert(`分數 ${score} 已存入！`);
      }
    }

    // 讀排行榜
    async function getTopScores() {
      const { data, error } = await supabase
        .from('scores')
        .select('*')
        .order('score', { ascending: false })
        .limit(10);
      if (error) {
        console.error('讀排行榜失敗', error);
        return [];
      }
      return data;
    }

    // 顯示排行榜
    getTopScores().then(top => {
      const board = document.getElementById('leaderboard');
      board.innerHTML = top.map((item, i) => `<p>#${i+1}: ${item.score}</p>`).join('');
    });

    // 更新頁面分數顯示（模擬遊戲分數增加）
    function updateScore(newScore) {
      playerScore = newScore;
      document.getElementById('score').innerText = playerScore;
      document.getElementById('scoreLabel').innerText = playerScore;
    }

    // 生成存分數按鈕
    const btn = document.createElement('button');
    btn.innerText = '存分數';
    btn.onclick = () => saveScore(playerScore);
    document.body.appendChild(btn);

    // 模擬遊戲增加分數
    setInterval(() => {
      updateScore(playerScore + 10);
    }, 2000);
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
