<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPS 遊戲 - 完整版</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <style>
    body { font-family: Arial; padding: 10px; margin:0; }
    #scoreLabel, #timer { font-weight: bold; font-size: 18px; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
    #leaderboard p { margin: 0; }
    #endBtn { display: none; margin-top: 20px; }
    canvas { display: block; background: #111; width: 100%; height: 400px; }
  </style>
</head>
<body>
  <h1>FPS 遊戲</h1>

  <div id="hud">
    <div>分數: <span id="scoreLabel">0</span></div>
    <div>剩餘時間: <span id="timer">30</span> 秒</div>
  </div>

  <canvas id="scene"></canvas>

  <div id="leaderboard">
    <h2>排行榜</h2>
  </div>

  <button id="endBtn">結束</button>

  <!-- 你的遊戲程式 -->
  <script type="module" src="/src/main.js"></script>

  <!-- 倒數、存分數、排行榜 -->
  <script>
    const supabaseUrl = 'https://owjmyizqlnfnjgbowqma.supabase.co';
    const supabaseAnonKey = 'sb_publishable_9hC0ccCj3t9gk6O6T3LKhw_FLvAn7Tu';
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    const scoreEl = document.getElementById('scoreLabel');
    const timerEl = document.getElementById('timer');
    const endBtn = document.getElementById('endBtn');

    let timeLeft = 30;
    let gameOver = false;

    function getCurrentScore() {
      return window.gameScore || 0;
    }

    async function saveScore(score) {
      const { data, error } = await supabase.from('scores').insert([{ score }]);
      if(error) console.error("存分數失敗", error);
    }

    async function loadLeaderboard() {
      const { data, error } = await supabase
        .from('scores')
        .select('*')
        .order('score', { ascending: false })
        .limit(10);
      if(error) return;
      const board = document.getElementById('leaderboard');
      board.innerHTML = '<h2>排行榜</h2>' + data.map((item, i) => `<p>#${i+1}: ${item.score}</p>`).join('');
    }

    // 倒數計時
    const countdown = setInterval(() => {
      if(timeLeft <= 0){
        clearInterval(countdown);
        gameOver = true;
        endBtn.style.display = 'inline-block';
        if(window.pauseGame) window.pauseGame(); // 暫停遊戲
        alert("時間到！請按「結束」返回主選單");
        loadLeaderboard();
      } else {
        timeLeft--;
        timerEl.innerText = timeLeft;
      }
    }, 1000);

    // 結束按鈕
    endBtn.onclick = async () => {
      if(!gameOver) return;
      const score = getCurrentScore();
      await saveScore(score);
      alert(`分數 ${score} 已存入資料庫！`);
      location.reload();
    }

    loadLeaderboard();
  </script>
</body>
</html>
