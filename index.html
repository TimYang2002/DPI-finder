<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS 靈敏度校準 - Web 3D</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div id="hud-left">
          <div class="hud-row">模式: <span id="modeLabel">自由練習</span></div>
          <div class="hud-row">訓練: <span id="drillLabel">混合</span></div>
          <div class="hud-row">時間: <span id="timeLabel">00:00</span></div>
          <div class="hud-row">分數: <span id="scoreLabel">0</span></div>
        </div>
        <div id="hud-right">
          <div class="hud-row">射擊: <span id="shotsLabel">0</span></div>
          <div class="hud-row">命中: <span id="hitsLabel">0</span></div>
          <div class="hud-row">命中率: <span id="accLabel">0%</span></div>
          <div class="hud-row">靈敏度: <span id="sensLabel">0.35</span></div>
        </div>
      </div>

      <div id="crosshair"></div>

      <div id="menu">
        <div class="panel">
          <h1>FPS 靈敏度校準</h1>
          <p class="sub">1600 DPI / VALORANT Sens</p>

          <div class="section">
            <label for="sensRange">靈敏度</label>
            <input id="sensRange" type="range" min="0.05" max="1.00" step="0.01" value="0.35" />
            <div class="small">當前: <span id="sensValue">0.35</span></div>
          </div>

          <div class="section">
            <button id="playBtn">開始自由練習</button>
            <button id="calibrateBtn">標準校準</button>
            <button id="quickBtn">快速校準</button>
            <button id="precisionBtn">精準校準</button>
          </div>

          <div class="section">
            <label for="drillSelect">練習模式</label>
            <select id="drillSelect">
              <option value="mix">混合</option>
              <option value="tap">微調點射</option>
              <option value="flick">快速甩槍</option>
              <option value="strafe">橫向追槍</option>
            </select>
            <div class="small" id="calibrationHint">校準流程: 7 個靈敏度，每段 20 秒</div>
            <div class="small">指標: 命中率 / 平均反應時間 / TTK / 角度誤差 / 過掃欠掃平衡</div>
          </div>

          <div class="section">
            <h2>Preset</h2>
            <div class="row">
              <button id="savePresetBtn">儲存目前靈敏度</button>
              <span class="small" id="presetStatus">尚未儲存</span>
            </div>
            <div class="row">
              <input id="shareCodeInput" placeholder="分享碼" />
              <button id="makeShareBtn">生成分享碼</button>
              <button id="applyShareBtn">套用分享碼</button>
            </div>
            <div class="small">分享碼包含 VALORANT 靈敏度數值與校準摘要。</div>
          </div>

          <div class="section" id="resultSection" hidden>
            <h2>推薦結果</h2>
            <div id="recommendLabel">—</div>
            <div class="small" id="recommendDetail">—</div>
          </div>

          <div class="section" id="tableSection" hidden>
            <h2>各段成績</h2>
            <div id="resultsTable"></div>
          </div>

          <div class="section small">點擊畫面進入滑鼠鎖定，Esc 退出。</div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
